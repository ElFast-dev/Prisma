<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080c12">
  <meta name="description" content="Prisma: tu laboratorio personal de recomendaciones cinematográficas.">

<body>
  <div class="app-shell">
    <header class="topbar">
      <a href="./" class="brand" aria-label="Prisma, inicio" data-nav="home">
        <img src="./assets/prisma.svg" alt="" width="38" height="38">
        <span class="brand-copy"><strong>prisma</strong><small>tu universo de cine</small></span>
      </a>
      <div class="topbar-right">
        <span class="privacy-pill"><span class="status-dot"></span> Perfil privado</span>
        <button class="avatar-button" type="button" data-nav="data" aria-label="Abrir datos y ajustes">P</button>

    <nav class="bottom-nav" aria-label="Navegación principal">

      <button class="nav-item" type="button" data-nav="library"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6 4.5h12a1.5 1.5 0 0 1 1.5 1.5v14L12 16l-7.5 4V6A1.5 1.5 0 0 1 6 4.5Z"/></svg></span><span>Mi lista</span></button>
      <button class="nav-item" type="button" data-nav="lab"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 19.5V12M10 19.5V5M16 19.5v-9M22 19.5V8"/></svg></span><span>Laboratorio</span></button>
      <button class="nav-item" type="button" data-nav="data"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="m19.4 15 .1.1 1.3 1-.9 1.6-1.6-.6a8 8 0 0 1-1.6.9l-.3 1.7h-2l-.4-1.7a8 8 0 0 1-1.6-.9l-1.6.6-.9-1.6 1.3-1a7 7 0 0 1 0-1.9l-1.3-1 .9-1.6 1.6.6a8 8 0 0 1 1.6-.9l.4-1.7h2l.3 1.7a8 8 0 0 1 1.6.9l1.6-.6.9 1.6-1.3 1a7 7 0 0 1-.1 1.8Z" transform="translate(-1 -1) scale(1.08)"/></svg></span><span>Datos</span></button>
    </nav>

    <main id="appRoot" class="main-content">
      <div class="loading-state"><span class="spinner"></span><p>Preparando tu universo cinematográfico…</p></div>
    </main>

  </div>

  <div id="modalRoot"></div>
  <div id="toastRoot" class="toast-root" role="status" aria-live="polite"></div>
  <input id="jsonImportInput" type="file" accept=".json,application/json" hidden>
  <input id="catalogImportInput" type="file" accept=".csv,text/csv,.tsv,text/tab-separated-values" hidden>
  <input id="backupImportInput" type="file" accept=".json,application/json" hidden>
</body>
</html>
