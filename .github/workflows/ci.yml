name: Prisma CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: TypeScript · Unit tests · Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Dependency security audit
        run: npm audit --audit-level=high
      - name: TypeScript check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Smoke test production build
        run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 --port 4174 --strictPort > /tmp/prisma-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error http://127.0.0.1:4174/Prisma/ -o /tmp/prisma-index.html; then
              break
            fi
            sleep 2
          done
          PRISMA_SMOKE_URL=http://127.0.0.1:4174/Prisma/ PRISMA_SMOKE_ATTEMPTS=1 node scripts/smoke-test-pages.mjs
      - name: Upload generated dependency lockfile
        uses: actions/upload-artifact@v7
        with:
          name: ci-generated-package-lock
          path: package-lock.json
          retention-days: 1

  e2e:
    name: Browser E2E · Playwright
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Install browser engines and system dependencies
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Run end-to-end browser tests
        run: npm run test:e2e
      - name: Upload Playwright report and failure evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore

  persist-lockfile:
    name: Generate and verify npm lockfile
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'automation/prisma-quality-gate' }}
    needs: [verify, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout this PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Generate the dependency lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify clean installation from the lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Commit lockfile to this PR branch only
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "El package-lock.json ya está actualizado."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: add reproducible npm lockfile"
          git push origin "HEAD:${HEAD_BRANCH}"
