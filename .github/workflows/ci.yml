name: Prisma Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prisma-android-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Recommendation engine · JVM tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"
      - name: Validate Python integration scripts
        run: python3 -m py_compile scripts/*.py
      - name: Test Gradle bootstrap script
        run: python3 scripts/test_configure_showly_recommender.py
      - name: Run engine tests and simulation
        run: gradle -p showly-recommendation-engine check

  android:
    name: Showly Android · Compile and unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with Showly submodule
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"
      - name: Create non-secret build configuration
        run: |
          cat > showly-android/local.properties <<'EOF'
          traktClientId="ci-placeholder-client"
          tmdbApiKey="ci-placeholder-key"
          EOF
          cat > showly-android/app/keystore.properties <<'EOF'
          keyAlias=github
          keyPassword=github
          storePassword=github
          EOF
      - name: Configure the engine and apply the personalized feed
        run: |
          python3 -m py_compile scripts/*.py
          python3 scripts/configure_showly_recommender.py
          python3 scripts/apply_showly_recommender.py
          python3 scripts/apply_showly_recommender.py
      - name: Compile app
        run: gradle -p showly-android :app:compileDebugKotlin --no-daemon
      - name: Test app and integration repositories
        run: |
          gradle -p showly-android :app:testDebugUnitTest --no-daemon
          gradle -p showly-android :repository:testDebugUnitTest --no-daemon
          gradle -p showly-android :ui-discover-movies:testDebugUnitTest --no-daemon
          gradle -p showly-android :ui-discover:testDebugUnitTest --no-daemon

  # Required verification context retained for the repository's branch protection.
  verify:
    name: verify
    needs: [engine, android]
    runs-on: ubuntu-latest
    steps:
      - name: Confirm all checks completed
        run: test -n "$GITHUB_SHA"
