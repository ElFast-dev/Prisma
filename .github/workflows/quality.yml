name: SDD and static quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate SDD and JavaScript syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: node --check app.js

      - name: Check native module syntax
        run: |
          node --check app.js
          node --check js/core/movie-utils.js
          node --check js/core/storage.js
          node --check js/core/storage-protection.js
          node --check js/core/state-model.js
          node --check js/recommendations/features.js
          node --check js/recommendations/engine.js
          node --check js/recommendations/evaluation.js
          node --check js/catalog/csv-parser.js
          node --check js/catalog/catalog-model.js
          node --check js/collection/collection-model.js
          node --check js/ui/presentation-utils.js
          node --check js/ui/page-views.js
          node --check js/ui/theme-controller.js
          node --check js/ui/modal-views.js
          node --check js/app/movie-actions.js
          node --check js/import-export/actions.js
          node --check js/app/event-handlers.js
          node --check js/tmdb/settings-actions.js
          node --check js/ui/tmdb-views.js
          node --check js/tmdb/history-sync.js
          node --check js/tmdb/browser-actions.js
          node --check js/app/lifecycle.js
          node --check js/app/pwa-update.js
          node --check js/app/runtime.js
          node --check js/recommendations/ranking.js
          node --check js/recommendations/preferences.js
          node --check js/ui/modal-controller.js
          node --check js/tmdb/movie-details.js
          node --check js/import-export/personal-data.js
          node --check js/tmdb/client.js
          node scripts/test-style-modularity.mjs

      - name: Check service worker syntax
        run: node --check sw.js

      - name: Validate SDD documents
        run: node scripts/validate-sdd.mjs

      - name: Test modular architecture and ES module linking
        run: node scripts/test-modular-architecture.mjs

      - name: Test isolated TMDB client
        run: node scripts/test-tmdb-client.mjs

      - name: Test TMDB settings connection action
        run: node scripts/test-tmdb-settings-actions.mjs

      - name: Test CSV import identity
        run: node scripts/test-catalog-import.mjs

      - name: Test empty first launch and saved-data preservation
        run: node scripts/test-empty-first-run.mjs

      - name: Test safe PWA update notification and refresh
        run: node scripts/test-pwa-update.mjs

      - name: Test rating-source transparency
        run: node scripts/test-movie-rating-sources.mjs

      - name: Test discovery and film detail UX
        run: node scripts/test-discovery-detail-polish.mjs

      - name: Test model evaluation identity and baseline
        run: node scripts/test-model-evaluation.mjs

      - name: Test design system tokens and motion preferences
        run: node scripts/test-design-system.mjs

      - name: Test mobile navigation touch targets and current page semantics
        run: node scripts/test-mobile-navigation.mjs

      - name: Test theme preference persistence
        run: node scripts/test-theme-controller.mjs

      - name: Test brand icon and PWA asset versions
        run: node scripts/test-brand-assets.mjs

      - name: Test coordinated PWA cache versions
        run: node scripts/test-cache-versioning.mjs

      - name: Test local storage protection API
        run: node scripts/test-storage-protection.mjs

      - name: Test recommendation feature extraction
        run: node scripts/test-recommendation-features.mjs

      - name: Test recommendation ranking quality and diversity
        run: node scripts/test-recommendation-evaluation.mjs

      - name: Test recommendation signal weighting
        run: node scripts/test-recommendation-signal-weighting.mjs

      - name: Test customizable discovery recommendation modes
        run: node scripts/test-recommendation-modes.mjs
