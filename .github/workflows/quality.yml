name: SDD and static quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate SDD and JavaScript syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: node --check app.js

      - name: Check native module syntax
        run: |
          node --check app.js
          node --check js/core/movie-utils.js
          node --check js/core/storage.js
          node --check js/core/state-model.js
          node --check js/recommendations/features.js
          node --check js/recommendations/engine.js
          node --check js/catalog/csv-parser.js
          node --check js/catalog/catalog-model.js
          node --check js/import-export/personal-data.js
          node --check js/tmdb/client.js
          node scripts/test-style-modularity.mjs

      - name: Check service worker syntax
        run: node --check sw.js

      - name: Validate SDD documents
        run: node scripts/validate-sdd.mjs

      - name: Test modular architecture and ES module linking
        run: node scripts/test-modular-architecture.mjs

      - name: Test isolated TMDB client
        run: node scripts/test-tmdb-client.mjs

      - name: Test CSV import identity
        run: node scripts/test-catalog-import.mjs

      - name: Test rating-source transparency
        run: node scripts/test-movie-rating-sources.mjs

      - name: Test discovery and film detail UX
        run: node scripts/test-discovery-detail-polish.mjs

      - name: Test model evaluation identity and baseline
        run: node scripts/test-model-evaluation.mjs

      - name: Test coordinated PWA cache versions
        run: node scripts/test-cache-versioning.mjs

      - name: Test recommendation signal weighting
        run: node scripts/test-recommendation-signal-weighting.mjs
