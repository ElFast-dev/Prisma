name: SDD and static quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate SDD and JavaScript syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: node --check app.js

      - name: Check service worker syntax
        run: node --check sw.js

      - name: Validate SDD documents
        run: node scripts/validate-sdd.mjs

      - name: Test CSV import identity
        run: node scripts/test-catalog-import.mjs

      - name: Test rating-source transparency
        run: node scripts/test-movie-rating-sources.mjs

      - name: Test discovery and film detail UX
        run: node scripts/test-discovery-detail-polish.mjs

      - name: Test model evaluation identity and baseline
        run: node scripts/test-model-evaluation.mjs

      - name: Test coordinated PWA cache versions
        run: node scripts/test-cache-versioning.mjs

      - name: Test recommendation signal weighting
        run: node scripts/test-recommendation-signal-weighting.mjs
