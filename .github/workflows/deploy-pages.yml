name: Deploy Prisma to GitHub Pages

on:
  workflow_run:
    workflows: ["Prisma UI screenshots"]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  # Invalid or cancelled screenshot workflow_run events can still start this workflow,
  # but their skipped jobs must never cancel an approved deployment already in progress.
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'workflow_run'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Download Playwright approval artifact
        uses: actions/download-artifact@v4
        with:
          name: prisma-published-ui-screenshots
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: release-approval

      - name: Validate approved source SHA
        id: tested-source
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(cat release-approval/tested-sha.txt)"
          if [[ ! "$source_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Playwright approval artifact does not contain a valid source SHA." >&2
            exit 1
          fi
          echo "Deploying SHA verified by quality and Playwright: $source_sha"
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"

      - name: Checkout the exact commit verified by Playwright
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tested-source.outputs.sha }}

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
