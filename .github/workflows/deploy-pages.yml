name: Deploy Prisma to GitHub Pages

on:
  workflow_run:
    workflows: ["Prisma UI screenshots"]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  # Invalid or cancelled screenshot workflow_run events can still start this workflow,
  # but their skipped jobs must never cancel an approved deployment already in progress.
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'workflow_run'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Download Playwright approval artifact
        uses: actions/download-artifact@v4
        with:
          name: prisma-published-ui-screenshots
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: release-approval

      - name: Validate approved source SHA
        id: tested-source
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(cat release-approval/tested-sha.txt)"
          if [[ ! "$source_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Playwright approval artifact does not contain a valid source SHA." >&2
            exit 1
          fi
          current_main_sha="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | awk 'NR == 1 {print $1}')"
          if [[ ! "$current_main_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Unable to resolve the current main SHA; refusing to deploy." >&2
            exit 1
          fi
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
          if [[ "$source_sha" != "$current_main_sha" ]]; then
            echo "Skipping stale Pages approval: tested=$source_sha current-main=$current_main_sha"
            echo "is_current=false" >> "$GITHUB_OUTPUT"
          else
            echo "Approved SHA is the current main head: $source_sha"
            echo "is_current=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout the exact commit verified by Playwright
        if: steps.tested-source.outputs.is_current == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tested-source.outputs.sha }}

      - name: Configure GitHub Pages
        if: steps.tested-source.outputs.is_current == 'true'
        uses: actions/configure-pages@v5

      - name: Upload static site
        if: steps.tested-source.outputs.is_current == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Revalidate current main SHA before publishing
        id: latest-source
        if: steps.tested-source.outputs.is_current == 'true'
        shell: bash
        run: |
          set -euo pipefail
          source_sha="${{ steps.tested-source.outputs.sha }}"
          current_main_sha="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | awk 'NR == 1 {print $1}')"
          if [[ ! "$current_main_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Unable to revalidate the current main SHA; refusing to deploy." >&2
            exit 1
          fi
          if [[ "$source_sha" != "$current_main_sha" ]]; then
            echo "Skipping stale publication: tested=$source_sha current-main=$current_main_sha"
            echo "is_current=false" >> "$GITHUB_OUTPUT"
          else
            echo "Publication SHA still matches main: $source_sha"
            echo "is_current=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.latest-source.outputs.is_current == 'true'
        uses: actions/deploy-pages@v4
