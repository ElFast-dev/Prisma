name: Prisma UI screenshots

on:
  workflow_run:
    workflows: ["Deploy Prisma to GitHub Pages"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  screenshots:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Serve the pull request build for browser tests
        if: github.event_name == 'pull_request'
        run: |
          python3 -m http.server 8765 --directory . > /tmp/prisma-preview.log 2>&1 &
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8765/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/prisma-preview.log
          exit 1

      - name: Capture the site and verify UI flows
        env:
          PRISMA_URL: ${{ github.event_name == 'pull_request' && 'http://127.0.0.1:8765/' || 'https://elfast-dev.github.io/Prisma/' }}
        run: |
          mkdir -p artifacts
          node <<'NODE'
          const { chromium } = require("playwright");
          const baseUrl = process.env.PRISMA_URL;

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const failures = [];

            async function openFreshPage(page, name) {
              let lastUI = null;
              for (let attempt = 1; attempt <= 12; attempt += 1) {
                await page.goto(baseUrl + "?screenshot=" + Date.now() + "-" + attempt, {
                  waitUntil: "networkidle",
                  timeout: 60000
                });
                await page.locator("main h1").waitFor({ state: "visible", timeout: 15000 });
                lastUI = await page.evaluate(() => {
                  const link = document.querySelector('link[rel="stylesheet"]');
                  const heading = document.querySelector("main h1");
                  const nav = document.querySelector(".bottom-nav");
                  const poster = document.querySelector(".poster-art");
                  return {
                    cssHref: link && link.href,
                    appSrc: (document.querySelector('script[src*="app.js"]') || {}).src || "",
                    rootBg: getComputedStyle(document.documentElement).getPropertyValue("--bg").trim(),
                    headlineFont: getComputedStyle(heading).fontFamily,
                    navRadius: getComputedStyle(nav).borderRadius,
                    posterRadius: poster && getComputedStyle(poster).borderRadius,
                    movieCards: document.querySelectorAll(".movie-card").length,
                    navItems: document.querySelectorAll(".bottom-nav .nav-item").length,
                    topSearch: Boolean(document.querySelector("[data-global-search]")),
                    hasInfoButton: document.querySelectorAll("[data-action='show-info']").length > 0,
                    busyCopy: /TU ESPACIO PERSONAL|TU CINE, A TU MANERA|Una mirada a tu historia/.test(document.body.innerText),
                    documentTitle: document.title
                  };
                });
                if (
                  lastUI.cssHref &&
                  lastUI.cssHref.includes("v=ui-20261020-17") &&
                  lastUI.appSrc.includes("v=ui-20261020-19") &&
                  lastUI.rootBg === "#080c12" &&
                  lastUI.headlineFont.includes("Inter") &&
                  lastUI.navItems === 3 &&
                  lastUI.topSearch &&
                  lastUI.hasInfoButton &&
                  !lastUI.busyCopy
                ) {
                  console.log(name + " published UI verified:", JSON.stringify(lastUI));
                  return;
                }
                console.log(name + " still seeing old version, retry " + attempt + ": " + JSON.stringify(lastUI));
                await page.waitForTimeout(4000);
              }
              throw new Error(name + ": the published page did not load the expected versioned styles: " + JSON.stringify(lastUI));
            }

            async function capture(name, viewport, isMobile) {
              const context = await browser.newContext({
                viewport,
                isMobile,
                deviceScaleFactor: isMobile ? 2 : 1,
                serviceWorkers: "block"
              });
              const page = await context.newPage();
              page.on("pageerror", error => failures.push(name + " pageerror: " + error.message));

              try {
                await openFreshPage(page, name + "-home");
                const onboarding = page.locator(".progress-onboarding");
                await onboarding.waitFor({ state: "visible", timeout: 10000 });
                const onboardingTitle = (await onboarding.locator("#progress-onboarding-title").innerText()).trim();
                if (onboardingTitle !== "Empieza a construir tu perfil") {
                  throw new Error(name + ": first-run guidance was not shown with the expected title");
                }
                const onboardingDestinations = await onboarding.locator(".progress-onboarding-actions [data-nav]")
                  .evaluateAll(nodes => nodes.map(node => node.getAttribute("data-nav")));
                if (JSON.stringify(onboardingDestinations) !== JSON.stringify(["catalog", "data"])) {
                  throw new Error(name + ": onboarding actions do not lead to Discover and Data: " + JSON.stringify(onboardingDestinations));
                }
                await page.screenshot({ path: "artifacts/" + name + "-home.png", fullPage: false, animations: "disabled" });
                await onboarding.locator(".progress-onboarding-actions [data-nav='catalog']").click();
                await page.locator(".discover-heading h1").waitFor({ state: "visible", timeout: 10000 });
                const recommendedMovies = await page.locator(".featured-recommendations .movie-poster-trigger").evaluateAll(nodes =>
                  nodes.map(node => ({
                    id: node.getAttribute("data-tmdb-id") || "",
                    title: (node.getAttribute("data-title") || "").trim().toLowerCase(),
                    year: node.getAttribute("data-year") || ""
                  }))
                );
                const recommendationKeys = recommendedMovies.map(movie =>
                  movie.id ? "tmdb:" + movie.id : "title:" + movie.title + ":" + movie.year
                );
                if (new Set(recommendationKeys).size !== recommendationKeys.length) {
                  throw new Error(name + ": Recomendadas para ti contains duplicate movie identities: " + JSON.stringify(recommendedMovies));
                }
                await page.locator(".topbar [data-nav='data']").click();
                await page.locator(".settings-grid").waitFor({ state: "visible", timeout: 10000 });
                await page.locator(".bottom-nav [data-nav='home']").click();
                await page.locator(".progress-onboarding").waitFor({ state: "visible", timeout: 10000 });
                await page.locator(".bottom-nav [data-nav='catalog']").click();
                await page.locator(".tmdb-browser").waitFor({ state: "visible", timeout: 10000 });
                await page.waitForTimeout(250);
                await page.screenshot({ path: "artifacts/" + name + "-catalog.png", fullPage: false, animations: "disabled" });
                await page.evaluate(() => {
                  const host = document.createElement("button");
                  host.id = "posterFallbackTest";
                  host.className = "poster-art movie-poster-trigger";
                  host.type = "button";
                  host.setAttribute("aria-label", "Fallback de póster de prueba");
                  host.innerHTML = '<img class="poster-image" src="' + new URL("__prisma-broken-poster-test__.jpg", location.href).href + '" alt=""><strong class="poster-title">Fallback de póster</strong>';
                  document.querySelector("#localCatalogResults").appendChild(host);
                });
                await page.waitForFunction(() => !document.querySelector("#posterFallbackTest .poster-image"), null, { timeout: 10000 });
                if (!(await page.locator("#posterFallbackTest .poster-title").isVisible())) {
                  throw new Error(name + ": poster title fallback stayed hidden after an image error");
                }
                await page.locator("#posterFallbackTest").evaluate(node => node.remove());
                await page.locator(".bottom-nav [data-nav='library']").click();
                await page.locator(".collection-page").waitFor({ state: "visible", timeout: 10000 });
                const collectionHeader = await page.evaluate(() => {
                  const modes = Array.from(document.querySelectorAll(".collection-mode-switch [role='tab']"));
                  const tabs = Array.from(document.querySelectorAll(".collection-tabs [role='tab']"));
                  const tools = document.querySelector(".collection-tools");
                  return {
                    modes: modes.map(node => node.innerText.trim()),
                    modePositions: modes.map(node => node.getBoundingClientRect().left),
                    tabs: tabs.map(node => node.getAttribute("data-tab")),
                    toolActions: Array.from(tools.querySelectorAll("[data-action]")).map(node => node.getAttribute("data-action")),
                    hasRedundantTitle: Boolean(document.querySelector(".collection-title-row"))
                  };
                });
                if (JSON.stringify(collectionHeader.modes) !== JSON.stringify(["Películas", "Listas"]) ||
                    collectionHeader.modePositions[0] >= collectionHeader.modePositions[1] ||
                    JSON.stringify(collectionHeader.tabs) !== JSON.stringify(["history", "pending", "hidden"]) ||
                    collectionHeader.hasRedundantTitle) {
                  throw new Error(name + ": the collection hierarchy is not ordered as specified: " + JSON.stringify(collectionHeader));
                }
                for (const action of ["toggle-collection-search", "open-sort", "open-genres", "toggle-layout"]) {
                  if (!collectionHeader.toolActions.includes(action)) {
                    throw new Error(name + ": collection toolbar misses action " + action);
                  }
                }
                await page.locator(".collection-search-trigger").click();
                await page.locator("[data-collection-search]").waitFor({ state: "visible", timeout: 10000 });
                await page.locator(".collection-search [data-action='toggle-collection-search']").click();
                await page.screenshot({ path: "artifacts/" + name + "-collection.png", fullPage: false, animations: "disabled" });
                await page.locator(".collection-tool[data-action='open-sort']").click();
                await page.locator(".utility-sheet .sheet-option").first().waitFor({ state: "visible", timeout: 10000 });
                const sortCount = await page.locator(".utility-sheet .sheet-option").count();
                if (sortCount !== 7) throw new Error(name + ": expected seven sort options, found " + sortCount);
                await page.screenshot({ path: "artifacts/" + name + "-sort-sheet.png", fullPage: false, animations: "disabled" });
                await page.locator("[data-action='close-sheet']").click();
                await page.locator("[data-action='show-info'][data-info='collection']").click();
                await page.locator(".info-sheet").waitFor({ state: "visible", timeout: 10000 });
                await page.screenshot({ path: "artifacts/" + name + "-info-sheet.png", fullPage: false, animations: "disabled" });
                await page.locator(".info-sheet .sheet-accept").click();
                await page.locator(".collection-tool[data-action='open-genres']").click();
                await page.locator(".sheet-genre-grid .sheet-genre").first().waitFor({ state: "visible", timeout: 10000 });
                if (await page.locator(".sheet-genre-grid .sheet-genre").count() < 15) {
                  throw new Error(name + ": the genre sheet is missing expected choices");
                }
                await page.locator("[data-action='close-sheet']").click();
                await page.locator(".collection-mode-switch [data-mode='lists']").click();
                await page.locator(".system-lists-grid").waitFor({ state: "visible", timeout: 10000 });
                await page.locator(".bottom-nav [data-nav='catalog']").click();
                await page.locator(".local-catalog-section .movie-card [data-action='details']").first().click();
                await page.locator(".detail-sheet").waitFor({ state: "visible", timeout: 10000 });
                await page.screenshot({ path: "artifacts/" + name + "-film-detail.png", fullPage: false, animations: "disabled" });
                await page.locator(".detail-action-strip [data-action='rate']").click();
                await page.locator(".rating-sheet .rating-star").last().waitFor({ state: "visible", timeout: 10000 });
                const ratingStars = await page.locator(".rating-sheet .rating-star").count();
                if (ratingStars !== 10) throw new Error(name + ": expected ten tappable rating stars, found " + ratingStars);
                await page.screenshot({ path: "artifacts/" + name + "-rating-sheet.png", fullPage: false, animations: "disabled" });
                await page.locator(".rating-sheet .rating-star[data-rating='8']").click();
                await page.locator(".rating-sheet [data-action='save-rating']").click();
                await page.locator(".detail-sheet").waitFor({ state: "visible", timeout: 10000 });
                if (!(await page.locator(".detail-action-strip").innerText()).includes("8/10")) throw new Error(name + ": the saved rating did not return to the film detail.");
                await page.locator(".detail-sheet [data-action='close-modal']").click();
                await page.locator(".bottom-nav [data-nav='home']").click();
                if (await page.locator(".progress-onboarding").count() !== 0) {
                  throw new Error(name + ": first-run guidance remained visible after saving a valid rating");
                }
                await page.locator(".topbar [data-nav='data']").click();
                await page.locator("#jsonImportInput").setInputFiles({
                  name: "prisma-import-test.json",
                  mimeType: "application/json",
                  buffer: Buffer.from(JSON.stringify({
                    movies: {
                      cH: [{ id: 91001, tmId: 10101, t: "Prisma Test Seen", a: "2024-01-01T00:00:00.000Z" }],
                      cW: [{ id: 91002, tmId: 10102, t: "Prisma Test Pending", a: "2024-01-02T00:00:00.000Z" }],
                      rM: [{ id: 91001, tmId: 10101, r: 8, rA: "2024-01-01T00:00:00.000Z" }]
                    },
                    shows: {
                      cW: [{ id: 92001, tmId: 20202, t: "Prisma Series Must Not Import", a: "2024-01-03T00:00:00.000Z" }]
                    }
                  }))
                });
                await page.locator(".bottom-nav [data-nav='library']").click();
                await page.locator(".collection-page").waitFor({ state: "visible", timeout: 10000 });
                await page.locator(".collection-mode-switch [data-mode='movies']").click();
                await page.locator(".collection-tabs [data-tab='history']").click();
                await page.locator(".collection-row-main[data-title='Prisma Test Seen']").waitFor({ state: "visible", timeout: 10000 });
                await page.locator(".collection-row-main[data-title='Prisma Test Seen']").click();
                await page.locator(".detail-sheet").waitFor({ state: "visible", timeout: 10000 });
                const watchedDateLabel = (await page.locator(".detail-state-button small").innerText()).trim();
                const dateParts = watchedDateLabel.split("/");
                if (dateParts.length !== 3 || dateParts[0].length !== 2 || dateParts[1].length !== 2 || dateParts[2].length !== 4 || watchedDateLabel.includes(":")) {
                  throw new Error(name + ": watched date must be MM/DD/YYYY without time: " + watchedDateLabel);
                }
                await page.locator(".detail-sheet [data-action='close-modal']").click();
                const recentLayout = await page.locator(".recent-grid").evaluate(node => ({
                  columns: getComputedStyle(node).gridTemplateColumns.split(" ").length,
                  count: node.querySelectorAll(".recent-movie").length
                }));
                if (recentLayout.columns !== 2 || recentLayout.count > 4 || recentLayout.count === 0) {
                  throw new Error(name + ": recent history does not use a 2×2 maximum layout: " + JSON.stringify(recentLayout));
                }
                await page.locator(".collection-tabs [data-tab='pending']").click();
                const releaseFilter = page.locator(".collection-tool[data-action='toggle-released']");
                await releaseFilter.waitFor({ state: "visible", timeout: 10000 });
                await releaseFilter.click();
                if (await releaseFilter.getAttribute("aria-pressed") !== "true") {
                  throw new Error(name + ": released-only filter did not expose its active state");
                }
                await releaseFilter.click();
                await page.locator(".collection-row-main[data-title='Prisma Test Pending']").waitFor({ state: "visible", timeout: 10000 });
                await page.locator(".collection-tabs [data-tab='history']").click();

                const testRow = page.locator(".collection-row:has(.collection-row-main[data-title='Prisma Test Seen'])");
                const testRowMain = testRow.locator(".collection-row-main");
                const hoverSupported = await page.evaluate(() => matchMedia("(hover: hover) and (pointer: fine)").matches);
                const normalMainBackground = await testRowMain.evaluate(node => getComputedStyle(node).backgroundColor);
                if (hoverSupported) {
                  await testRowMain.hover();
                  await page.waitForTimeout(220);
                  const hoverStyles = await testRowMain.evaluate(node => {
                    const row = node.closest(".collection-row");
                    return {
                      background: getComputedStyle(node).backgroundColor,
                      transform: getComputedStyle(node).transform,
                      mainHovered: node.matches(":hover"),
                      rowHovered: Boolean(row && row.matches(":hover")),
                      hoverMedia: matchMedia("(hover: hover) and (pointer: fine)").matches
                    };
                  });
                  if (!hoverStyles.background || hoverStyles.background === normalMainBackground) {
                    throw new Error(name + ": collection row action hover did not change its background: " + JSON.stringify(hoverStyles));
                  }
                  if (hoverStyles.transform !== "none") {
                    throw new Error(name + ": collection row's main action moved during hover: " + hoverStyles.transform);
                  }
                  await page.mouse.move(0, 0);
                  await page.waitForTimeout(220);
                  const restoredBackground = await testRowMain.evaluate(node => getComputedStyle(node).backgroundColor);
                  if (restoredBackground !== normalMainBackground) {
                    throw new Error(name + ": collection row action did not restore its background after hover");
                  }
                }
                await page.emulateMedia({ reducedMotion: "reduce" });
                const reducedMotionStyles = await testRow.evaluate(node => {
                  const style = getComputedStyle(node);
                  return { duration: style.transitionDuration, property: style.transitionProperty };
                });
                if (reducedMotionStyles.duration !== "0s" && reducedMotionStyles.property !== "none") {
                  throw new Error(name + ": collection row still animates with reduced motion: " + JSON.stringify(reducedMotionStyles));
                }
                await page.emulateMedia({ reducedMotion: "no-preference" });

                await page.locator(".collection-tabs [data-tab='pending']").click();
                await page.locator(".collection-row-main[data-title='Prisma Test Pending']").waitFor({ state: "visible", timeout: 10000 });
                if ((await page.locator(".collection-page").innerText()).includes("Prisma Series Must Not Import")) {
                  throw new Error(name + ": a series was included in the movie import");
                }

                await page.locator(".bottom-nav [data-nav='catalog']").click();
                await page.locator("[data-global-search]").fill("Prisma Test Seen");
                await page.waitForTimeout(250);
                const alreadySeenDiscoverCards = await page.locator(".local-catalog-section .movie-card [data-action='details'][data-title='Prisma Test Seen']").count();
                if (alreadySeenDiscoverCards !== 0) {
                  throw new Error(name + ": a movie already watched still appears in local Discover");
                }
                await page.locator("[data-global-search]").fill("");
                await page.waitForTimeout(500);
                await page.locator(".topbar [data-nav='data']").click();
                await page.locator("#catalogImportInput").setInputFiles({
                  name: "prisma-remake-test.csv",
                  mimeType: "text/csv",
                  buffer: Buffer.from(
                    "movieId,title,year,tmdb_id,genres,overview\n" +
                    "50001,Prisma CSV Remake Fixture,1998,990001,Drama,\"" + ("La historia sigue a una investigadora que descubre un misterio en su ciudad. ").repeat(28) + "\"\n" +
                    "50002,Prisma CSV Remake Fixture,2024,990002,Action,Una sinopsis breve\n" +
                    "60001,Prisma MovieLens Namespace Fixture (2001),2001,,Drama,Sinopsis auxiliar"
                  )
                });
                await page.waitForFunction(() => (document.querySelector("#toastRoot")?.innerText || "").includes("Catálogo ampliado: 3 títulos importados."));

                async function readCustomCatalogFixture() {
                  return page.evaluate(() => new Promise((resolve, reject) => {
                    const open = indexedDB.open("prisma-local-v1", 1);
                    open.onerror = () => reject(open.error || new Error("Could not open Prisma database"));
                    open.onsuccess = () => {
                      const db = open.result;
                      const request = db.transaction("kv", "readonly").objectStore("kv").get("catalogCustom");
                      request.onerror = () => reject(request.error || new Error("Could not read the custom catalog"));
                      request.onsuccess = () => {
                        resolve((request.result && Array.isArray(request.result.value) ? request.result.value : [])
                          .filter(movie => /Prisma (CSV Remake|MovieLens Namespace) Fixture/.test(movie.title))
                          .map(movie => ({ title: movie.title, tmdbId: movie.tmdbId || null, id: movie.id, year: movie.year, genres: movie.genres || [] }))
                        );
                        db.close();
                      };
                    };
                  }));
                }

                const importedFixture = await readCustomCatalogFixture();
                const remakes = importedFixture.filter(movie => movie.title === "Prisma CSV Remake Fixture");
                const tmdbIds = remakes.map(movie => movie.tmdbId).sort();
                if (remakes.length !== 2 || JSON.stringify(tmdbIds) !== JSON.stringify(["990001", "990002"])) {
                  throw new Error(name + ": CSV import collapsed remakes with distinct TMDB IDs: " + JSON.stringify(importedFixture));
                }
                const movieLensRow = importedFixture.find(movie => movie.title === "Prisma MovieLens Namespace Fixture");
                if (!movieLensRow || movieLensRow.tmdbId || String(movieLensRow.id) !== "60001") {
                  throw new Error(name + ": a generic source ID was incorrectly treated as a TMDB ID: " + JSON.stringify(movieLensRow));
                }

                await page.locator("[data-global-search]").fill("Prisma CSV Remake Fixture");
                await page.waitForFunction(() => document.querySelectorAll("#localCatalogResults .movie-card").length === 2);
                const displayedRemakeIds = await page.locator("#localCatalogResults .movie-card [data-action='details']")
                  .evaluateAll(nodes => nodes.map(node => node.getAttribute("data-tmdb-id")).sort());
                if (JSON.stringify(displayedRemakeIds) !== JSON.stringify(["990001", "990002"])) {
                  throw new Error(name + ": the combined catalog did not display both distinct TMDB identities: " + JSON.stringify(displayedRemakeIds));
                }
                const cleanPosterCards = await page.locator("#localCatalogResults .movie-card").evaluateAll(cards => cards.map(card => {
                  const poster = card.querySelector(".movie-poster-trigger");
                  const image = poster && poster.querySelector(".poster-image");
                  const title = poster && poster.querySelector(".poster-title");
                  return {
                    posterOnly: card.classList.contains("movie-card-poster-only"),
                    isButton: Boolean(poster && poster.tagName === "BUTTON"),
                    accessibleName: Boolean(poster && poster.getAttribute("aria-label")),
                    hasDuplicateCopy: Boolean(card.querySelector(".movie-copy,.movie-actions,.movie-score,.movie-meta")),
                    titleOverlayVisible: Boolean(image && title && getComputedStyle(title).display !== "none")
                  };
                }));
                if (cleanPosterCards.length !== 2 || cleanPosterCards.some(card => !card.posterOnly || !card.isButton || !card.accessibleName || card.hasDuplicateCopy || card.titleOverlayVisible)) {
                  throw new Error(name + ": Discover poster cards still duplicate metadata or are not accessible: " + JSON.stringify(cleanPosterCards));
                }

                // Hiding one remake must not hide the other movie that shares its title.
                await page.locator("#localCatalogResults .movie-card [data-action='details'][data-tmdb-id='990001']").click();
                await page.locator(".detail-sheet").waitFor({ state: "visible", timeout: 10000 });
                const longSynopsisText = (await page.locator(".detail-sheet .synopsis-section p").innerText()).trim();
                const detailScrollBefore = await page.locator(".detail-sheet .detail-scroll").evaluate(node => ({
                  clientHeight: node.clientHeight,
                  scrollHeight: node.scrollHeight,
                  overflowY: getComputedStyle(node).overflowY
                }));
                if (longSynopsisText.length < 1000 || detailScrollBefore.scrollHeight <= detailScrollBefore.clientHeight || detailScrollBefore.overflowY !== "auto") {
                  throw new Error(name + ": long synopsis cannot scroll inside the movie detail sheet: " + JSON.stringify({ synopsisLength: longSynopsisText.length, ...detailScrollBefore }));
                }
                await page.locator(".detail-sheet .detail-scroll").evaluate(node => { node.scrollTop = node.scrollHeight; });
                const reachedSynopsisEnd = await page.locator(".detail-sheet .detail-scroll").evaluate(node => Math.ceil(node.scrollTop + node.clientHeight) >= node.scrollHeight - 1);
                if (!reachedSynopsisEnd) throw new Error(name + ": movie detail cannot scroll to its final sections");
                await page.locator(".detail-sheet .detail-scroll").evaluate(node => { node.scrollTop = 0; });
                const ratingCardSize = await page.locator(".detail-rating-card").first().evaluate(node => {
                  const rect = node.getBoundingClientRect();
                  return { width: rect.width, height: rect.height, minHeight: getComputedStyle(node).minHeight };
                });
                if (ratingCardSize.height >= ratingCardSize.width || ratingCardSize.height > 80) {
                  throw new Error(name + ": rating links still render as oversized squares: " + JSON.stringify(ratingCardSize));
                }
                await page.locator(".detail-state-actions [data-action='toggle-hidden']").click();
                await page.waitForFunction(() => {
                  const button = document.querySelector(".detail-state-actions [data-action='toggle-hidden']");
                  return button && button.innerText.trim() === "Mostrar en Prisma";
                }, null, { timeout: 10000 });
                const hiddenActionLabel = (await page.locator(".detail-state-actions [data-action='toggle-hidden']").innerText()).trim();
                if (hiddenActionLabel !== "Mostrar en Prisma") {
                  throw new Error(name + ": the selected remake was not marked hidden");
                }
                await page.locator(".detail-sheet [data-action='close-modal']").click();
                await page.locator(".bottom-nav [data-nav='home']").click();
                await page.locator(".bottom-nav [data-nav='catalog']").click();
                await page.waitForFunction(() => document.querySelectorAll("#localCatalogResults .movie-card [data-action='details']").length === 1);
                const remainingRemakeIds = await page.locator("#localCatalogResults .movie-card [data-action='details']")
                  .evaluateAll(nodes => nodes.map(node => node.getAttribute("data-tmdb-id")));
                if (JSON.stringify(remainingRemakeIds) !== JSON.stringify(["990002"])) {
                  throw new Error(name + ": hiding TMDB ID 990001 also hid a distinct identity: " + JSON.stringify(remainingRemakeIds));
                }

                await page.locator(".topbar [data-nav='data']").click();
                await page.locator("#catalogImportInput").setInputFiles({
                  name: "prisma-remake-reimport-test.csv",
                  mimeType: "text/csv",
                  buffer: Buffer.from("movieId,title,year,tmdb_id,genres\n50001,Prisma CSV Remake Fixture,1998,990001,Comedy")
                });
                await page.waitForFunction(() => (document.querySelector("#toastRoot")?.innerText || "").includes("Catálogo ampliado: 1 títulos importados."));
                const reimportedFixture = await readCustomCatalogFixture();
                const reimportedRemakes = reimportedFixture.filter(movie => movie.title === "Prisma CSV Remake Fixture");
                const reimportedIds = reimportedRemakes.map(movie => movie.tmdbId).sort();
                const sameIdentity = reimportedRemakes.find(movie => movie.tmdbId === "990001");
                if (reimportedRemakes.length !== 2 || JSON.stringify(reimportedIds) !== JSON.stringify(["990001", "990002"])) {
                  throw new Error(name + ": reimport created or removed a remake identity: " + JSON.stringify(reimportedFixture));
                }
                if (!sameIdentity || !sameIdentity.genres.includes("Drama") || !sameIdentity.genres.includes("Comedia")) {
                  throw new Error(name + ": reimport did not merge metadata into TMDB identity 990001: " + JSON.stringify(sameIdentity));
                }
              } finally {
                await context.close();
              }
            }

            try {
              await capture("desktop", { width: 1440, height: 1050 }, false);
              await capture("mobile", { width: 390, height: 844 }, true);
              if (failures.length) throw new Error(failures.join("\n"));
            } finally {
              await browser.close();
            }
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prisma-published-ui-screenshots
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
