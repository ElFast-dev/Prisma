name: Prisma UI screenshots

on:
  workflow_run:
    workflows: ["Deploy Prisma to GitHub Pages"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  screenshots:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Serve the pull request build for browser tests
        if: github.event_name == 'pull_request'
        run: |
          python3 -m http.server 8765 --directory . > /tmp/prisma-preview.log 2>&1 &
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8765/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/prisma-preview.log
          exit 1

      - name: Capture the site and verify UI flows
        env:
          PRISMA_URL: ${{ github.event_name == 'pull_request' && 'http://127.0.0.1:8765/' || 'https://elfast-dev.github.io/Prisma/' }}
        run: |
          mkdir -p artifacts
          node <<'NODE'
          const { chromium } = require("playwright");
          const baseUrl = process.env.PRISMA_URL;

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const failures = [];

            async function openFreshPage(page, name) {
              let lastUI = null;
              for (let attempt = 1; attempt <= 12; attempt += 1) {
                await page.goto(baseUrl + "?screenshot=" + Date.now() + "-" + attempt, {
                  waitUntil: "networkidle",
                  timeout: 60000
                });
                await page.locator("main h1").waitFor({ state: "visible", timeout: 15000 });
                lastUI = await page.evaluate(() => {
                  const link = document.querySelector('link[rel="stylesheet"]');
                  const heading = document.querySelector("main h1");
                  const nav = document.querySelector(".bottom-nav");
                  const poster = document.querySelector(".poster-art");
                  return {
                    cssHref: link && link.href,
                    rootBg: getComputedStyle(document.documentElement).getPropertyValue("--bg").trim(),
                    headlineFont: getComputedStyle(heading).fontFamily,
                    navRadius: getComputedStyle(nav).borderRadius,
                    posterRadius: poster && getComputedStyle(poster).borderRadius,
                    movieCards: document.querySelectorAll(".movie-card").length,
                    navItems: document.querySelectorAll(".bottom-nav .nav-item").length,
                    topSearch: Boolean(document.querySelector("[data-global-search]")),
                    documentTitle: document.title
                  };
                });
                if (
                  lastUI.cssHref &&
                  lastUI.cssHref.includes("v=ui-20261020-10") &&
                  lastUI.rootBg === "#080c12" &&
                  lastUI.headlineFont.includes("Inter") &&
                  lastUI.navItems === 3 &&
                  lastUI.topSearch
                ) {
                  console.log(name + " published UI verified:", JSON.stringify(lastUI));
                  return;
                }
                console.log(name + " still seeing old version, retry " + attempt + ": " + JSON.stringify(lastUI));
                await page.waitForTimeout(4000);
              }
              throw new Error(name + ": the published page did not load the expected versioned styles: " + JSON.stringify(lastUI));
            }

            async function capture(name, viewport, isMobile) {
              const context = await browser.newContext({
                viewport,
                isMobile,
                deviceScaleFactor: isMobile ? 2 : 1,
                serviceWorkers: "block"
              });
              const page = await context.newPage();
              page.on("pageerror", error => failures.push(name + " pageerror: " + error.message));

              try {
                await openFreshPage(page, name + "-home");
                await page.screenshot({ path: "artifacts/" + name + "-home.png", fullPage: false, animations: "disabled" });
                await page.locator(".bottom-nav [data-nav='catalog']").click();
                await page.locator(".tmdb-browser").waitFor({ state: "visible", timeout: 10000 });
                await page.waitForTimeout(250);
                await page.screenshot({ path: "artifacts/" + name + "-catalog.png", fullPage: false, animations: "disabled" });
                await page.locator(".bottom-nav [data-nav='library']").click();
                await page.locator(".collection-page").waitFor({ state: "visible", timeout: 10000 });
                await page.screenshot({ path: "artifacts/" + name + "-collection.png", fullPage: false, animations: "disabled" });
                await page.locator(".collection-tool[data-action='open-sort']").click();
                await page.locator(".utility-sheet .sheet-option").first().waitFor({ state: "visible", timeout: 10000 });
                const sortCount = await page.locator(".utility-sheet .sheet-option").count();
                if (sortCount !== 7) throw new Error(name + ": expected seven sort options, found " + sortCount);
                await page.screenshot({ path: "artifacts/" + name + "-sort-sheet.png", fullPage: false, animations: "disabled" });
                await page.locator("[data-action='close-sheet']").click();
                await page.locator(".collection-mode-switch [data-mode='lists']").click();
                await page.locator(".system-lists-grid").waitFor({ state: "visible", timeout: 10000 });
              } finally {
                await context.close();
              }
            }

            try {
              await capture("desktop", { width: 1440, height: 1050 }, false);
              await capture("mobile", { width: 390, height: 844 }, true);
              if (failures.length) throw new Error(failures.join("\n"));
            } finally {
              await browser.close();
            }
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prisma-published-ui-screenshots
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
