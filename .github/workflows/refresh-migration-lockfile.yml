name: Refresh temporary Workbox 8 migration lockfile

on:
  push:
    branches:
      - security/migrate-pwa-workbox

permissions:
  contents: write

jobs:
  lockfile:
    name: Resolve and commit reproducible npm lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v7
        with:
          ref: security/migrate-pwa-workbox
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Resolve package lock without running lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit generated lockfile
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: refresh lockfile for Vite PWA Workbox 8"
          git push origin "HEAD:${GITHUB_REF_NAME}"
